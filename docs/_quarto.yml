          - reference-models.qmd
          - reference-utilities.qmd
          - licensing.qmd
      - section: "Compatibility and limitations"
        contents:
          - r-compatibility.qmd
      - section: "Benchmarks and verification"
        contents:
          - verification.qmd
          - href: verifications/distributions.qmd
            text: "Distributions: verification"
          - href: benchmarks/distributions.qmd
            text: "Distributions: performance"
          - href: benchmarks/rng.qmd
