website:
  site-url: "https://phpstats.github.io/phit/"
  title: "phit"
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Overview
      - section: "Getting started"
        contents:
          - installation.qmd
          - extension-or-polyfill.qmd
          - getting-started.qmd
      - section: "Guides"
        contents:
          - formulas.qmd
          - models.qmd
          - mixed-models.qmd
          - missing-data.qmd
          - distributions.qmd
          - descriptive.qmd
