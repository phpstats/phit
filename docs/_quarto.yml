            text: "OLS: performance"
          - href: verifications/logistic.qmd
            text: "Logistic: verification"
          - href: notebooks/logistic-verification.qmd
            text: "Logistic: R and statsmodels comparison"
          - href: benchmarks/logistic.qmd
            text: "Logistic: performance"
          - href: verifications/probit.qmd
            text: "Probit: verification"
          - href: notebooks/probit-verification.qmd
            text: "Probit: R and statsmodels comparison"
          - href: benchmarks/probit.qmd
            text: "Probit: performance"
          - href: verifications/poisson.qmd
            text: "Poisson: verification"
          - href: notebooks/poisson-verification.qmd
            text: "Poisson: R and statsmodels comparison"
          - href: benchmarks/poisson.qmd
            text: "Poisson: performance"
          - href: verifications/lmm.qmd
            text: "Gaussian mixed: verification"
          - href: notebooks/lmm-verification.qmd
            text: "Gaussian mixed: synthetic comparison"
