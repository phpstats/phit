    - benchmarks/poisson-results.json
    - verifications/poisson-results.json
    - verifications/compare_poisson.py
    - verifications/poisson.R
    - verifications/poisson.php

website:
  site-url: "https://phit.phpstats.org/docs/"
  title: "phit"
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Overview
      - section: "Getting started"
        contents:
          - installation.qmd
          - extension-or-polyfill.qmd
          - getting-started.qmd
      - section: "Guides"
        contents:
          - formulas.qmd
          - models.qmd
          - mixed-models.qmd
          - missing-data.qmd
          - distributions.qmd
          - descriptive.qmd
          - rng.qmd
          - draw-numerics.qmd
          - io.qmd
          - deployment.qmd
      - section: "Examples"
        contents:
          - examples/linear-model.qmd
          - examples/glm.qmd
          - examples/mixed-model.qmd
          - examples/distributions.qmd
          - examples/polars-mixed-model.qmd
      - section: "Reference"
        contents:
          - contracts.qmd
          - reference-models.qmd
          - reference-utilities.qmd
          - licensing.qmd
      - section: "Compatibility and limitations"
        contents:
          - r-compatibility.qmd
      - section: "Mathematics"
        contents:
          - href: notebooks/index.qmd
            text: "Walkthroughs"
          - href: notebooks/ols-math.qmd
            text: "OLS"
          - href: ols-math.qmd
            text: "OLS: Rust implementation"
          - href: notebooks/logistic-math.qmd
            text: "Logistic regression"
          - href: notebooks/probit-math.qmd
            text: "Probit regression"
          - href: notebooks/poisson-math.qmd
            text: "Poisson regression"
          - href: notebooks/lmm-math.qmd
            text: "Gaussian random intercept"
          - href: notebooks/lmm-general-math.qmd
            text: "Random slopes and REML"
          - href: notebooks/logistic-mixed-math.qmd
            text: "Binomial random intercept"
          - href: data/lmm/index.qmd
            text: "Published data sets"
      - section: "Contributing"
        contents:
          - development.qmd
          - releasing.qmd
          - documentation.qmd
          - visualization.qmd
          - design-philosophy.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    html-math-method: mathjax

execute:
  freeze: true
  error: false
  daemon: false
