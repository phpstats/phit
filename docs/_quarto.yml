    - data/lmm/*.csv
    - data/lmm/sources.json
    - data/lmm/COPYING
    - verifications/lmm-public-results.json
    - verifications/lmm-results.json
    - verifications/lmm.R
    - verifications/lmm.php
    - verifications/compare_lmm.py
    - benchmarks/lmm-results.json
    - verifications/r-compatibility-results.json
    - verifications/compare_r_compatibility.py
    - notebooks/requirements.txt
    - data/probit-learning.csv
    - benchmarks/probit-results.json
