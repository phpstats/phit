name: Rust and PHP checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux PHP headers and clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-dev clang libclang-dev
          echo "PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "PHP_CONFIG=$(command -v php-config)" >> "$GITHUB_ENV"
      - name: macOS PHP headers and clang
        if: runner.os == 'macOS'
        run: |
          brew install php llvm
          echo "PHP=$(brew --prefix php)/bin/php" >> "$GITHUB_ENV"
          echo "PHP_CONFIG=$(brew --prefix php)/bin/php-config" >> "$GITHUB_ENV"
          llvm_prefix="$(brew --prefix llvm)"
          echo "LIBCLANG_PATH=$llvm_prefix/lib" >> "$GITHUB_ENV"
          echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir=$($llvm_prefix/bin/clang -print-resource-dir) -isysroot=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Stable Rust
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - name: Test and load extension
        run: ./scripts/check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer lint
