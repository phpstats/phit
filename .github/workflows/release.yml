name: Prepare versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment:
    uses: ./.github/workflows/packaging.yml
  source:
    needs: deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag, crate versions and MIT license
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          root = pathlib.Path('.')
          versions = [tomllib.loads((root / p).read_text())['package']['version']
                      for p in ['crates/stats-core/Cargo.toml', 'crates/php-extension/Cargo.toml']]
          assert versions[0] == versions[1], versions
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', versions[0])
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + versions[0], 'tag/crate version mismatch'
          assert (root / 'LICENSE').read_text().startswith('MIT License')
          with open(os.environ['GITHUB_ENV'], 'a') as out: out.write('RELEASE_VERSION=' + versions[0] + '\n')
          PY
      - name: Create source archive and checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="phit-$RELEASE_VERSION/" HEAD > "dist/phit-$RELEASE_VERSION.tar.gz"
          # Record the bare archive name, so SHA256SUMS verifies from whatever
          # directory a consumer downloads the published assets into.
          (cd dist && sha256sum "phit-$RELEASE_VERSION.tar.gz" > SHA256SUMS)
      - name: Check required package files
        run: |
          python3 - <<'PY'
          import os, tarfile
          version = os.environ['RELEASE_VERSION']
          with tarfile.open(f'dist/phit-{version}.tar.gz') as archive:
              names = {p.name.removeprefix(f'phit-{version}/') for p in archive.getmembers()}
          for path in ['LICENSE', 'composer.json', 'Cargo.lock', 'Cargo.toml',
                       'pie/config.m4', 'pie/Makefile.frag', 'crates/php-extension/src/lib.rs',
                       'crates/stats-core/src/lib.rs', 'tests/deployment.php']:
              assert path in names, path
          assert not any('/_freeze/' in p or p.startswith('docs/site_libs/') for p in names)
          PY
      - name: Verify installation from the actual source archive
        run: |
          mkdir -p .context/source-test
          tar -xzf "dist/phit-$RELEASE_VERSION.tar.gz" -C .context/source-test
          source_root=".context/source-test/phit-$RELEASE_VERSION"
          docker build --progress=plain --target checks -f "$source_root/docker/Dockerfile" -t archive-checks "$source_root"
          docker build --progress=plain -f "$source_root/docker/Dockerfile" -t archive-runtime "$source_root"
          "$source_root/scripts/check-container" archive-runtime archive-checks > dist/deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: phit-source
          path: dist/

  publish:
    needs: source
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The binaries are the ones packaging.yml already built and tested; the
      # linux-*-nts-bookworm glob takes those and leaves the deployment reports.
      - name: Create the GitHub release with the source archive and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt Linux x86_64 NTS extensions for PHP 8.3, 8.4 and 8.5 on Debian Bookworm, with the source archive. Each binary archive carries its own manifest.json recording the exact ABI it was built and tested against." \
            artifacts/phit-source/* artifacts/linux-*-nts-bookworm/*
      - name: Verify the published source archive against its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p published-source
          gh release download "$GITHUB_REF_NAME" --dir published-source \
            --pattern "phit-$version.tar.gz" --pattern SHA256SUMS
          cd published-source && sha256sum -c SHA256SUMS

  verify-release:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        # packaging.yml builds amd64 only, so the published binaries are x86_64.
        include:
          - php: '8.3'
            image: php:8.3-fpm-bookworm@sha256:f768bd9142444f6126a690697b028c23f30878c3b628a7c355dfce75e29cc045
          - php: '8.4'
            image: php:8.4-fpm-bookworm@sha256:6bfef8e416977aa41f48e3e42a40c1e08050d24e4a938c6edb421400bff24601
          - php: '8.5'
            image: php:8.5-fpm-bookworm@sha256:dd198c828c224e479bdaa184cdcf04a28c73d186bf5a885493bf9cc78d7196ef
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the published binary into a clean PHP ${{ matrix.php }} image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" --dir release \
            --pattern "phit-*-php${{ matrix.php }}-x86_64-nts-bookworm.*"
          cd release && sha256sum -c ./*.sha256 && tar -xzf ./*.tar.gz && cd ..
          docker run --rm --volume "$PWD:/src:ro" "${{ matrix.image }}" sh -euc '
            cp /src/release/phit-*-nts-bookworm/phit.so "$(php-config --extension-dir)/"
            echo "extension=phit.so" > /usr/local/etc/php/conf.d/90-phit.ini
            php -m | grep -qx phit
            php /src/tests/deployment.php'

  verify-binaries:
    # The same install path as verify-release, from the packaging artifacts
    # instead of release assets, so a workflow_dispatch run exercises the
    # checksum, the archive layout and the deployment test without a tag.
    # Keep the docker step below in step with verify-release.
    needs: deployment
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: php:8.3-fpm-bookworm@sha256:f768bd9142444f6126a690697b028c23f30878c3b628a7c355dfce75e29cc045
          - php: '8.4'
            image: php:8.4-fpm-bookworm@sha256:6bfef8e416977aa41f48e3e42a40c1e08050d24e4a938c6edb421400bff24601
          - php: '8.5'
            image: php:8.5-fpm-bookworm@sha256:dd198c828c224e479bdaa184cdcf04a28c73d186bf5a885493bf9cc78d7196ef
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-php-${{ matrix.php }}-nts-bookworm
          path: release
      - name: Install the packaged binary into a clean PHP ${{ matrix.php }} image
        run: |
          cd release && sha256sum -c ./*.sha256 && tar -xzf ./*.tar.gz && cd ..
          docker run --rm --volume "$PWD:/src:ro" "${{ matrix.image }}" sh -euc '
            cp /src/release/phit-*-nts-bookworm/phit.so "$(php-config --extension-dir)/"
            echo "extension=phit.so" > /usr/local/etc/php/conf.d/90-phit.ini
            php -m | grep -qx phit
            php /src/tests/deployment.php'
