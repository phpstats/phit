[package]
name = "stats-core"
version = "0.3.1"
license = "MIT"
edition = "2024"

[dependencies]
bobyqa = "=0.3.2"
argmin = { version = "=0.11.0", default-features = false }
argmin-math = { version = "=0.5.1", default-features = false, features = ["vec"] }
# Tail-accurate incomplete beta/gamma (TOMS 708/654) and Cody normal CDF for the
# distribution API; statrs remains the special-function source for the estimators.
cdflib = "=0.4.3"
# Line and delimiter search for the CSV reader (already locked transitively).
memchr = "=2.8.3"
nalgebra = "0.35"
# Explicitly seeded sampling; both versions were already locked transitively.
rand = { version = "=0.9.5", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.9.0", default-features = false }
statrs = { version = "0.19", default-features = false }

[dev-dependencies]
# Correctly rounded parsing: fixture inputs must round-trip bit for bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
